# production 環境の変数契約。デプロイ前に落とすことで、認証情報の不足や
# 取り違えが Cloudflare へ反映されてから発覚する事態を防ぐ。
# gh-assert は診断に値を出力しないため、Secrets をそのまま渡せる
env:
  CLOUDFLARE_API_TOKEN:
    required: true

  CLOUDFLARE_ACCOUNT_ID:
    required: true
    type:
      string:
        # Cloudflare のアカウント ID は 32 桁の 16 進数。ダッシュボードから
        # 別の ID（Zone ID 等）を貼り違えても長さが同じで気づけないため検証する
        pattern: '^[0-9a-f]{32}$'

  SUPABASE_URL:
    required: true
    type:
      string:
        # ローカル用の http://127.0.0.1:54321 が production に残る事故を防ぐ
        pattern: '^https://'

  SUPABASE_ANON_KEY:
    required: true

  DISCORD_WEBHOOK_URL:
    required: true
    type:
      string:
        # Webhook URL 以外（チャンネル URL 等）だと通知が無言で失敗するため形式を固定する
        pattern: '^https://discord(app)?\.com/api/webhooks/'

  TURNSTILE_SECRET_KEY:
    required: true
    type:
      string:
        # Turnstile の secret key は 0x 始まり。site key との取り違えを弾く
        pattern: '^0x'
