name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 対象リソース
        required: true
        default: web
        type: choice
        options:
          - web
          - cron
          - database

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # 変数契約はデプロイ対象の有無に依らない前提条件のため、差分検知より前に置く。
  # デプロイが発生する回にしか検証しないと、設定不備の発覚がデプロイ直前になる
  assert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      # 契約ファイルをリポジトリから読むため
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: production 変数の検証
        uses: rin2yh/gh-assert@f7a002c160f5125e5de4a4ee817fe57c88850b48 # v0.0.4
        with:
          contract: .github/assert/cd_assert.yml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  changes:
    needs: assert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.manual.outputs.web || steps.detect.outputs.web }}
      cron: ${{ steps.manual.outputs.cron || steps.detect.outputs.cron }}
      database: ${{ steps.manual.outputs.database || steps.detect.outputs.database }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI を通過したコミットをデプロイ対象にする(手動実行時はデフォルトブランチ)
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # ひとつ前のコミットとの差分を取るため
          fetch-depth: 2
          persist-credentials: false
      - name: 手動実行の対象指定
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEPLOY_TYPE: ${{ github.event.inputs.deploy_type }}
        run: echo "${DEPLOY_TYPE}=true" >> "$GITHUB_OUTPUT"

      - id: detect
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: ./.github/actions/detect-changes
        with:
          # CIを通過したコミットとその直前との差分をデプロイ対象にする
          base: HEAD~1

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Node.jsの構築
        uses: ./.github/actions/setup_node
        with:
          node-version-file: .node-version

      - name: Worker ビルド
        run: pnpm --filter @trend-diary/web build:worker

      - name: cf でデプロイ
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"
          node -e 'const fs = require("node:fs"); const keys = ["SUPABASE_URL", "SUPABASE_ANON_KEY", "DISCORD_WEBHOOK_URL", "TURNSTILE_SECRET_KEY"]; fs.writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(keys.map(key => [key, process.env[key]]))))' "$secrets_file"
          pnpm exec cf deploy --prebuilt --secrets-file "$secrets_file"

      - name: スモークテスト(ヘルスチェック)
        env:
          DEPLOYMENT_URL: https://trend-diary.gtms.workers.dev
        run: |
          set -euo pipefail

          # デプロイ直後はWorkerの反映に数秒のラグがあるためリトライする
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${DEPLOYMENT_URL}/api/health"; then
              echo "ヘルスチェック成功"
              exit 0
            fi
            echo "ヘルスチェック失敗 (試行 ${attempt}/5)。5秒後にリトライします"
            sleep 5
          done

          echo "ヘルスチェックが規定回数失敗しました"
          exit 1

      - name: スモークテスト失敗をDiscordへ通知
        if: ${{ failure() && steps.deploy.conclusion == 'success' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "DISCORD_WEBHOOK_URLが未設定のため通知をスキップします"
            exit 0
          fi

          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\": \":rotating_light: webデプロイ後のヘルスチェックに失敗しました\n${RUN_URL}\"}" \
            "${DISCORD_WEBHOOK_URL}"

  cron:
    needs: changes
    if: ${{ needs.changes.outputs.cron == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Node.jsの構築
        uses: ./.github/actions/setup_node
        with:
          node-version-file: .node-version

      - name: cf で Cron Worker をデプロイ
        working-directory: apps/cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ DISCORD_WEBHOOK_URL: process.env.DISCORD_WEBHOOK_URL }))' "$secrets_file"
          pnpm exec cf deploy --secrets-file "$secrets_file"

  database:
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Node.jsの構築
        uses: ./.github/actions/setup_node
        with:
          node-version-file: .node-version

      - name: D1のマイグレーション適用
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/web
          command: d1 migrations apply trend-diary-db --remote
