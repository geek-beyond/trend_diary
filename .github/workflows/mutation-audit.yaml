name: Mutation audit

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/mutation-audit.yaml'
      - 'scripts/mutation/**'
      - 'apps/web/vitest.mutation*.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: audit (${{ matrix.project }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project:
          - std
          - authentication
          - datastore
          - domain
          - logger
          - notification
          - runtime
          - web-client
          - web-server
          - cron
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Supabase Emulator
        if: ${{ matrix.project == 'web-server' }}
        uses: rin2yh/supa-emu@3aea79b6dda513da1e335562d80320bf78a4e8fc # v0.1.9
        with:
          version: v0.1.8
          addr: 127.0.0.1:54321
          webauthn-rp-id: 127.0.0.1
      - name: Audit command tests
        run: node --test scripts/mutation/audit.test.mjs
      - name: Full kill matrix
        env:
          AUDIT_PROJECT: ${{ matrix.project }}
        run: |
          mkdir -p mutation-audit
          node scripts/mutation/audit.mjs "$AUDIT_PROJECT" 2>&1 | tee "mutation-audit/$AUDIT_PROJECT.log"
      - name: Save reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-audit-${{ matrix.project }}
          path: mutation-audit/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Mutation audit summary
    permissions:
      contents: read
    needs: audit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Collect all project reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-audit-*
          merge-multiple: true
          path: mutation-audit-input
      - name: Summary tests
        run: node --test scripts/mutation/summarize.test.mjs
      - name: Summarize every finding
        if: ${{ always() }}
        env:
          AUDIT_REVISION: ${{ github.sha }}
        run: node scripts/mutation/summarize.mjs mutation-audit-input mutation-audit-summary
      - name: Save complete machine-readable findings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-audit-summary
          path: mutation-audit-summary/
          if-no-files-found: error
          retention-days: 30
