packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# パッケージ間で共有する依存のバージョンを集中管理する。
# 各パッケージでは "<dep>": "catalog:" と宣言してここのバージョンを参照する。
catalog:
  '@cloudflare/vitest-pool-workers': ^0.22.0
  '@cloudflare/workers-types': ^5.20260827.1
  '@faker-js/faker': ^10.6.0
  '@playwright/test': ^1.62.1
  '@supabase/supabase-js': ^2.112.4
  '@types/node': ^26.4.0
  drizzle-orm: 0.45.2
  neverthrow: ^8.2.0
  playwright: ^1.62.1
  vitest: ^4.1.11
  wrangler: ^4.127.0
  zod: ^4.4.3

allowBuilds:
  esbuild: false
  sharp: false
  workerd: false

minimumReleaseAge: 4320

overrides:
  '@cloudflare/vitest-pool-workers>miniflare': 5.20260826.0-alpha
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  '@hono/node-server': ^1.19.13
  brace-expansion: ^2.0.3
  defu: ^6.1.5
  effect: ^3.20.0
  lodash: ^4.18.1
  picomatch: ^4.0.4
